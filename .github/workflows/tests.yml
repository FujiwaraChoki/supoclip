name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  serving-rollout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install nginx for the isolated proxy
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nginx
      - name: Exercise readiness, traffic switching, transfer draining and rollback
        run: |
          python3 deploy/serving/test_prepare.py
          python3 deploy/serving/test_switch.py

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: supoclip
          POSTGRES_USER: supoclip
          POSTGRES_PASSWORD: supoclip_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supoclip -d supoclip"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://supoclip:supoclip_password@127.0.0.1:5432/supoclip
      TEST_DATABASE_URL: postgresql+asyncpg://supoclip:supoclip_password@127.0.0.1:5432/supoclip
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      SELF_HOST: "true"
      BACKEND_AUTH_SECRET: supoclip_test_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v4
      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - name: Install fx runtime dependencies
        run: cd backend/src/fx_runtime && deno install --frozen
      - name: Install backend dependencies
        run: cd backend && uv sync --frozen --all-groups
      - name: Run backend tests
        run: cd backend && .venv/bin/pytest
      - name: Run fx runtime tests
        run: cd backend/src/fx_runtime && deno task test

  fx-media-ffmpeg61:
    # The dynamic-edits chain must behave the same on ffmpeg 6.1 (Ubuntu 24.04) as on 7.1 (the backend image, checked by
    # the fx_selftest step in image-security.yml): colour, frame counts, audio graph (FINAL G19).
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install ffmpeg 6.1 and system libraries
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            ffmpeg ca-certificates curl git unzip libgl1 libglib2.0-0 fonts-noto-core
          ffmpeg -version | head -n 1
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - name: Install fx runtime dependencies
        run: cd backend/src/fx_runtime && deno install --frozen
      - name: Install backend dependencies (Python 3.11)
        run: cd backend && uv sync --frozen --all-groups --python 3.11
      - name: Run the FX media suite on ffmpeg 6.1
        run: cd backend && .venv/bin/pytest --no-cov tests/unit/fx_media

  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SELF_HOST: "true"
      BACKEND_AUTH_SECRET: supoclip_test_secret
      BETTER_AUTH_SECRET: supoclip_better_auth_test_secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile
      - name: Lint and type-check frontend
        run: cd frontend && pnpm run lint && pnpm run typecheck
      - name: Run frontend unit tests
        run: cd frontend && pnpm run test:coverage
      - name: Check the fx-core bundle is up to date
        run: cd frontend && pnpm run build:fx-core && git diff --exit-code ../backend/src/fx_runtime/fx-core.js

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v4
      - name: Run MCP server tests
        run: cd mcp && uv run --with pytest pytest tests -q

  e2e:
    # Playwright 1.59 does not support ubuntu-latest's Ubuntu 26.04 image.
    runs-on: ubuntu-24.04
    needs:
      - backend
      - frontend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: supoclip
          POSTGRES_USER: supoclip
          POSTGRES_PASSWORD: supoclip_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supoclip -d supoclip"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://supoclip:supoclip_password@127.0.0.1:5432/supoclip
      TEST_DATABASE_URL: postgresql+asyncpg://supoclip:supoclip_password@127.0.0.1:5432/supoclip
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      NEXT_PUBLIC_SELF_HOST: "true"
      BACKEND_AUTH_SECRET: supoclip_test_secret
      BETTER_AUTH_SECRET: supoclip_better_auth_test_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install backend dependencies
        run: cd backend && uv sync --frozen --all-groups
      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: cd frontend && pnpm exec playwright install --with-deps
      - name: Run Playwright smoke tests
        run: cd frontend && pnpm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
