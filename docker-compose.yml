services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: ${FRONTEND_BUILD_TARGET:-development}
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3107}
        - NEXT_PUBLIC_SELF_HOST=${SELF_HOST:-true}
        - NEXT_PUBLIC_PRO_PRICE_MONTHLY=${NEXT_PUBLIC_PRO_PRICE_MONTHLY:-9.99}
        - NEXT_PUBLIC_SCALE_PRICE_MONTHLY=${NEXT_PUBLIC_SCALE_PRICE_MONTHLY:-24.99}
        - NEXT_PUBLIC_PRO_PRICE_ANNUAL=${NEXT_PUBLIC_PRO_PRICE_ANNUAL:-99.90}
        - NEXT_PUBLIC_SCALE_PRICE_ANNUAL=${NEXT_PUBLIC_SCALE_PRICE_ANNUAL:-249.90}
        - NEXT_PUBLIC_PRO_PLAN_MINUTE_LIMIT=${NEXT_PUBLIC_PRO_PLAN_MINUTE_LIMIT:-600}
        - NEXT_PUBLIC_SCALE_PLAN_MINUTE_LIMIT=${NEXT_PUBLIC_SCALE_PLAN_MINUTE_LIMIT:-1500}
        - NEXT_PUBLIC_SOCIAL_PUBLISHING=${NEXT_PUBLIC_SOCIAL_PUBLISHING:-}
        - NEXT_PUBLIC_DATAFAST_WEBSITE_ID=${NEXT_PUBLIC_DATAFAST_WEBSITE_ID:-}
        - NEXT_PUBLIC_DATAFAST_DOMAIN=${NEXT_PUBLIC_DATAFAST_DOMAIN:-}
        - NEXT_PUBLIC_DATAFAST_ALLOW_LOCALHOST=${NEXT_PUBLIC_DATAFAST_ALLOW_LOCALHOST:-false}
        - NEXT_PUBLIC_POSTHOG_KEY=${NEXT_PUBLIC_POSTHOG_KEY:-}
        - NEXT_PUBLIC_POSTHOG_HOST=${NEXT_PUBLIC_POSTHOG_HOST:-https://eu.i.posthog.com}
        # Source map upload to PostHog error tracking; skipped unless both are set.
        - POSTHOG_PERSONAL_API_KEY=${POSTHOG_PERSONAL_API_KEY:-}
        - POSTHOG_PROJECT_ID=${POSTHOG_PROJECT_ID:-}
        - POSTHOG_RELEASE_VERSION=${POSTHOG_RELEASE_VERSION:-}
    container_name: supoclip-frontend
    ports:
      # Keep the legacy port for deployments whose proxy already uses 3001.
      # .env.example selects 3107 for new self-hosted installations.
      - "127.0.0.1:${FRONTEND_PORT:-3001}:3107"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/prisma:/app/prisma
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - BACKEND_INTERNAL_URL=http://backend:8000
      - NEXT_PUBLIC_SELF_HOST=${SELF_HOST:-true}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3107}
      - NEXT_PUBLIC_LANDING_ONLY_MODE=${NEXT_PUBLIC_LANDING_ONLY_MODE:-false}
      - DISABLE_SIGN_UP=${DISABLE_SIGN_UP:-false}
      - BACKEND_AUTH_SECRET=${BACKEND_AUTH_SECRET}
      - APP_SETTINGS_ENCRYPTION_KEY=${APP_SETTINGS_ENCRYPTION_KEY}
      - DATABASE_URL=postgresql://supoclip:supoclip_password@postgres:5432/supoclip
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-supoclip_dev_secret_change_in_production}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3107}
      - BETTER_AUTH_TRUSTED_ORIGINS=${BETTER_AUTH_TRUSTED_ORIGINS:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRICE_ID=${STRIPE_PRICE_ID}
      - STRIPE_PRO_PRICE_ID=${STRIPE_PRO_PRICE_ID}
      - STRIPE_SCALE_PRICE_ID=${STRIPE_SCALE_PRICE_ID}
      - STRIPE_PRO_ANNUAL_PRICE_ID=${STRIPE_PRO_ANNUAL_PRICE_ID}
      - STRIPE_SCALE_ANNUAL_PRICE_ID=${STRIPE_SCALE_ANNUAL_PRICE_ID}
      - STRIPE_PRO_LEGACY_PRICE_IDS=${STRIPE_PRO_LEGACY_PRICE_IDS:-}
      - STRIPE_SCALE_LEGACY_PRICE_IDS=${STRIPE_SCALE_LEGACY_PRICE_IDS:-}
      - NEXT_PUBLIC_PRO_PRICE_MONTHLY=${NEXT_PUBLIC_PRO_PRICE_MONTHLY:-9.99}
      - NEXT_PUBLIC_SCALE_PRICE_MONTHLY=${NEXT_PUBLIC_SCALE_PRICE_MONTHLY:-24.99}
      - NEXT_PUBLIC_PRO_PRICE_ANNUAL=${NEXT_PUBLIC_PRO_PRICE_ANNUAL:-99.90}
      - NEXT_PUBLIC_SCALE_PRICE_ANNUAL=${NEXT_PUBLIC_SCALE_PRICE_ANNUAL:-249.90}
      - NEXT_PUBLIC_PRO_PLAN_MINUTE_LIMIT=${NEXT_PUBLIC_PRO_PLAN_MINUTE_LIMIT:-600}
      - NEXT_PUBLIC_SCALE_PLAN_MINUTE_LIMIT=${NEXT_PUBLIC_SCALE_PLAN_MINUTE_LIMIT:-1500}
      - NEXT_PUBLIC_SOCIAL_PUBLISHING=${NEXT_PUBLIC_SOCIAL_PUBLISHING:-}
      - NEXT_PUBLIC_DATAFAST_WEBSITE_ID=${NEXT_PUBLIC_DATAFAST_WEBSITE_ID:-}
      - NEXT_PUBLIC_DATAFAST_DOMAIN=${NEXT_PUBLIC_DATAFAST_DOMAIN:-}
      - NEXT_PUBLIC_DATAFAST_ALLOW_LOCALHOST=${NEXT_PUBLIC_DATAFAST_ALLOW_LOCALHOST:-false}
      - NEXT_PUBLIC_POSTHOG_KEY=${NEXT_PUBLIC_POSTHOG_KEY:-}
      - NEXT_PUBLIC_POSTHOG_HOST=${NEXT_PUBLIC_POSTHOG_HOST:-https://eu.i.posthog.com}
      - STRIPE_CHECKOUT_URL=${STRIPE_CHECKOUT_URL}
      - STRIPE_CUSTOMER_PORTAL_URL=${STRIPE_CUSTOMER_PORTAL_URL}
      - REVENUECAT_WEBHOOK_AUTH_HEADER=${REVENUECAT_WEBHOOK_AUTH_HEADER}
      - REVENUECAT_PRO_PRODUCT_IDS=${REVENUECAT_PRO_PRODUCT_IDS}
      - REVENUECAT_SCALE_PRODUCT_IDS=${REVENUECAT_SCALE_PRODUCT_IDS}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - "SES_FROM_EMAIL=${SES_FROM_EMAIL:-SupoClip <onboarding@example.com>}"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Exercise Better Auth and Prisma, not only the static landing page.
      test: ["CMD", "curl", "-f", "http://localhost:3107/api/auth/get-session"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BACKEND_CPU_ONLY: ${BACKEND_CPU_ONLY:-false}
    container_name: supoclip-backend
    platform: linux/amd64
    command: [".venv/bin/uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/src:/app/src
      - uploads:/app/uploads
      - clips:/app/clips
      - ./backend/fonts:/app/fonts
      - ./backend/transitions:/app/transitions
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - SUPOCLIP_SERVICE=backend
      - POSTHOG_PROJECT_TOKEN=${POSTHOG_PROJECT_TOKEN:-}
      - POSTHOG_HOST=${POSTHOG_HOST:-https://eu.i.posthog.com}
      - DATABASE_URL=postgresql+asyncpg://supoclip:supoclip_password@postgres:5432/supoclip
      - TEMP_DIR=/app/uploads
      - MEDIA_STORAGE=${MEDIA_STORAGE:-local}
      - MEDIA_S3_BUCKET=${MEDIA_S3_BUCKET:-}
      - MEDIA_S3_PREFIX=${MEDIA_S3_PREFIX:-media}
      - MEDIA_S3_REGION=${MEDIA_S3_REGION:-eu-central-1}
      - MEDIA_S3_ENDPOINT=${MEDIA_S3_ENDPOINT:-}
      - MEDIA_S3_ACCESS_KEY_ID=${MEDIA_S3_ACCESS_KEY_ID:-}
      - MEDIA_S3_SECRET_ACCESS_KEY=${MEDIA_S3_SECRET_ACCESS_KEY:-}
      - MEDIA_S3_SESSION_TOKEN=${MEDIA_S3_SESSION_TOKEN:-}
      - MEDIA_URL_TTL_SECONDS=${MEDIA_URL_TTL_SECONDS:-900}
      - MEDIA_CACHE_TTL_SECONDS=${MEDIA_CACHE_TTL_SECONDS:-86400}
      - MEDIA_ORPHAN_GRACE_SECONDS=${MEDIA_ORPHAN_GRACE_SECONDS:-86400}
      - MEDIA_UPLOAD_CONCURRENCY=${MEDIA_UPLOAD_CONCURRENCY:-3}
      - MEDIA_UPLOAD_DAILY_LIMIT=${MEDIA_UPLOAD_DAILY_LIMIT:-20}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ASSEMBLY_AI_API_KEY=${ASSEMBLY_AI_API_KEY}
      - ASSEMBLY_AI_HTTP_TIMEOUT_SECONDS=${ASSEMBLY_AI_HTTP_TIMEOUT_SECONDS:-900}
      - ASSEMBLY_AI_REQUEST_TIMEOUT_SECONDS=${ASSEMBLY_AI_REQUEST_TIMEOUT_SECONDS:-60}
      - APIFY_API_TOKEN=${APIFY_API_TOKEN}
      - RAPIDAPI_YOUTUBE_API_KEY=${RAPIDAPI_YOUTUBE_API_KEY:-}
      - RAPIDAPI_YOUTUBE_TIMEOUT_SECONDS=${RAPIDAPI_YOUTUBE_TIMEOUT_SECONDS:-300}
      - RAPIDAPI_YOUTUBE_HOST=${RAPIDAPI_YOUTUBE_HOST:-}
      - RAPIDAPI_YOUTUBE_RELAY_HOST=${RAPIDAPI_YOUTUBE_RELAY_HOST:-}
      - APIFY_YOUTUBE_DOWNLOADER_ACTOR=${APIFY_YOUTUBE_DOWNLOADER_ACTOR:-}
      - APIFY_YOUTUBE_PROVIDERS=${APIFY_YOUTUBE_PROVIDERS:-}
      - APIFY_STORAGE_BUCKET=${APIFY_STORAGE_BUCKET:-}
      - APIFY_STORAGE_REGION=${APIFY_STORAGE_REGION:-}
      - APIFY_STORAGE_WRITER_ACCESS_KEY_ID=${APIFY_STORAGE_WRITER_ACCESS_KEY_ID:-}
      - APIFY_STORAGE_WRITER_SECRET_ACCESS_KEY=${APIFY_STORAGE_WRITER_SECRET_ACCESS_KEY:-}
      - APIFY_STORAGE_READER_ACCESS_KEY_ID=${APIFY_STORAGE_READER_ACCESS_KEY_ID:-}
      - APIFY_STORAGE_READER_SECRET_ACCESS_KEY=${APIFY_STORAGE_READER_SECRET_ACCESS_KEY:-}
      - APIFY_STORAGE_KEY_TEMPLATE=${APIFY_STORAGE_KEY_TEMPLATE:-}
      - APIFY_YOUTUBE_FALLBACK_ACTOR=${APIFY_YOUTUBE_FALLBACK_ACTOR:-}
      - APIFY_YOUTUBE_FALLBACK_ACTORS=${APIFY_YOUTUBE_FALLBACK_ACTORS:-}
      - APIFY_DOWNLOAD_MAX_CHARGE_USD=${APIFY_DOWNLOAD_MAX_CHARGE_USD:-6}
      - APIFY_FALLBACK_MAX_CHARGE_USD=${APIFY_FALLBACK_MAX_CHARGE_USD:-6}
      - APIFY_YOUTUBE_INPUT_ADAPTER=${APIFY_YOUTUBE_INPUT_ADAPTER:-start_urls}
      - APIFY_YOUTUBE_DEFAULT_QUALITY=${APIFY_YOUTUBE_DEFAULT_QUALITY:-1080}
      - APIFY_RUN_TIMEOUT_SECONDS=${APIFY_RUN_TIMEOUT_SECONDS:-3600}
      - YOUTUBE_DATA_API_KEY=${YOUTUBE_DATA_API_KEY}
      - YOUTUBE_METADATA_PROVIDER=${YOUTUBE_METADATA_PROVIDER:-yt_dlp}
      - YOUTUBE_DOWNLOAD_PROVIDER=${YOUTUBE_DOWNLOAD_PROVIDER:-yt_dlp}
      - YOUTUBE_PROXY_URL=${YOUTUBE_PROXY_URL:-}
      - YOUTUBE_PROXY_TIMEOUT_SECONDS=${YOUTUBE_PROXY_TIMEOUT_SECONDS:-300}
      - YOUTUBE_PROXY_COUNTRY=${YOUTUBE_PROXY_COUNTRY:-}
      - YOUTUBE_POT_PROVIDER_URL=${YOUTUBE_POT_PROVIDER_URL:-}
      - YOUTUBE_DOWNLOAD_MAX_BYTES=${YOUTUBE_DOWNLOAD_MAX_BYTES:-2000000000}
      - YOUTUBE_SECTION_PADDING_SECONDS=${YOUTUBE_SECTION_PADDING_SECONDS:-10}
      - YOUTUBE_MAX_HEIGHT=${YOUTUBE_MAX_HEIGHT:-1080}
      - YOUTUBE_SOURCE_CACHE=${YOUTUBE_SOURCE_CACHE:-on}
      - YOUTUBE_SOURCE_CACHE_TTL_SECONDS=${YOUTUBE_SOURCE_CACHE_TTL_SECONDS:-604800}
      - APIFY_EXPENSIVE_FALLBACKS=${APIFY_EXPENSIVE_FALLBACKS:-false}
      - LLM=${LLM:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_FALLBACK_MODEL=${OPENROUTER_FALLBACK_MODEL:-openai/gpt-6-luna}
      - RERANK_LLM=${RERANK_LLM:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - TRANSCRIPTION_PROVIDER=${TRANSCRIPTION_PROVIDER:-assemblyai}
      - TRANSCRIPTION_LANGUAGE=${TRANSCRIPTION_LANGUAGE:-}
      - WHISPER_MODEL_SIZE=${WHISPER_MODEL_SIZE:-medium}
      - MAX_VIDEO_DURATION=${MAX_VIDEO_DURATION:-5400}
      - PRO_YOUTUBE_MAX_VIDEO_DURATION=${PRO_YOUTUBE_MAX_VIDEO_DURATION:-5400}
      - SCALE_YOUTUBE_MAX_VIDEO_DURATION=${SCALE_YOUTUBE_MAX_VIDEO_DURATION:-10800}
      - MAX_VIDEO_UPLOAD_BYTES=${MAX_VIDEO_UPLOAD_BYTES:-12000000000}
      - QUEUED_TASK_TIMEOUT_SECONDS=${QUEUED_TASK_TIMEOUT_SECONDS:-180}
      - DEFAULT_PROCESSING_MODE=${DEFAULT_PROCESSING_MODE:-fast}
      - MAX_CLIPS=${MAX_CLIPS:-10}
      - FAST_MODE_MAX_CLIPS=${FAST_MODE_MAX_CLIPS:-10}
      - SPEAKER_FRAMING=${SPEAKER_FRAMING:-true}
      - HOOK_FIRST_TEASER=${HOOK_FIRST_TEASER:-false}
      - FAST_MODE_TRANSCRIPT_MODEL=${FAST_MODE_TRANSCRIPT_MODEL:-universal-3-5-pro}
      - SELF_HOST=${SELF_HOST:-true}
      - BACKEND_AUTH_SECRET=${BACKEND_AUTH_SECRET}
      - APP_SETTINGS_ENCRYPTION_KEY=${APP_SETTINGS_ENCRYPTION_KEY}
      - AUTH_SIGNATURE_TTL_SECONDS=${AUTH_SIGNATURE_TTL_SECONDS:-300}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3107,http://sp.localhost:3107,http://supoclip.localhost:3107}
      - PRO_PLAN_MINUTE_LIMIT=${PRO_PLAN_MINUTE_LIMIT:-600}
      - SCALE_PLAN_MINUTE_LIMIT=${SCALE_PLAN_MINUTE_LIMIT:-1500}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - "SES_FROM_EMAIL=${SES_FROM_EMAIL:-SupoClip <onboarding@example.com>}"
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3107}
      - DISCORD_FEEDBACK_WEBHOOK_URL=${DISCORD_FEEDBACK_WEBHOOK_URL}
      # Social publishing (OAuth apps; users connect their own accounts)
      - YOUTUBE_OAUTH_CLIENT_ID=${YOUTUBE_OAUTH_CLIENT_ID}
      - YOUTUBE_OAUTH_CLIENT_SECRET=${YOUTUBE_OAUTH_CLIENT_SECRET}
      - TIKTOK_CLIENT_KEY=${TIKTOK_CLIENT_KEY}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET}
      - INSTAGRAM_APP_ID=${INSTAGRAM_APP_ID}
      - INSTAGRAM_APP_SECRET=${INSTAGRAM_APP_SECRET}
      - SOCIAL_OAUTH_REDIRECT_BASE_URL=${SOCIAL_OAUTH_REDIRECT_BASE_URL}
      - SOCIAL_PUBLIC_MEDIA_BASE_URL=${SOCIAL_PUBLIC_MEDIA_BASE_URL}
      - SOCIAL_METRICS_REFRESH_HOURS=${SOCIAL_METRICS_REFRESH_HOURS:-6}
      - SOCIAL_METRICS_MAX_POST_AGE_DAYS=${SOCIAL_METRICS_MAX_POST_AGE_DAYS:-60}
      - SOCIAL_PERFORMANCE_MIN_POSTS=${SOCIAL_PERFORMANCE_MIN_POSTS:-3}
      - SOCIAL_PUBLISHING_ACCESS=${SOCIAL_PUBLISHING_ACCESS:-off}
      - SOCIAL_PUBLISHING_ALLOWED_EMAILS=${SOCIAL_PUBLISHING_ALLOWED_EMAILS:-}
      - DISCORD_SALES_WEBHOOK_URL=${DISCORD_SALES_WEBHOOK_URL}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/db"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    container_name: supoclip-mcp
    ports:
      - "127.0.0.1:${SUPOCLIP_MCP_PORT:-9100}:9100"
    volumes:
      - mcp_downloads:/app/supoclip-downloads
    environment:
      - SUPOCLIP_API_URL=${SUPOCLIP_API_URL:-http://backend:8000}
      - SUPOCLIP_DOWNLOAD_DIR=/app/supoclip-downloads
      - SUPOCLIP_TIMEOUT=${SUPOCLIP_TIMEOUT:-60}
      - SUPOCLIP_MCP_TRANSPORT=${SUPOCLIP_MCP_TRANSPORT:-sse}
      - SUPOCLIP_MCP_HOST=0.0.0.0
      - SUPOCLIP_MCP_PORT=9100
      - SUPOCLIP_MCP_PUBLIC_URL=${SUPOCLIP_MCP_PUBLIC_URL:-https://mcp.supoclip.com}
      - SUPOCLIP_MCP_REQUIRE_BEARER_AUTH=${SUPOCLIP_MCP_REQUIRE_BEARER_AUTH:-true}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 9100), 5); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Worker process for background video processing
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BACKEND_CPU_ONLY: ${BACKEND_CPU_ONLY:-false}
    container_name: supoclip-worker
    platform: linux/amd64
    command: [".venv/bin/arq", "src.workers.tasks.WorkerSettings"]
    volumes:
      - ./backend/src:/app/src
      - uploads:/app/uploads
      - clips:/app/clips
      - ./backend/fonts:/app/fonts
      - ./backend/transitions:/app/transitions
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - SUPOCLIP_SERVICE=worker
      - POSTHOG_PROJECT_TOKEN=${POSTHOG_PROJECT_TOKEN:-}
      - POSTHOG_HOST=${POSTHOG_HOST:-https://eu.i.posthog.com}
      - DATABASE_URL=postgresql+asyncpg://supoclip:supoclip_password@postgres:5432/supoclip
      - TEMP_DIR=/app/uploads
      - MEDIA_STORAGE=${MEDIA_STORAGE:-local}
      - MEDIA_S3_BUCKET=${MEDIA_S3_BUCKET:-}
      - MEDIA_S3_PREFIX=${MEDIA_S3_PREFIX:-media}
      - MEDIA_S3_REGION=${MEDIA_S3_REGION:-eu-central-1}
      - MEDIA_S3_ENDPOINT=${MEDIA_S3_ENDPOINT:-}
      - MEDIA_S3_ACCESS_KEY_ID=${MEDIA_S3_ACCESS_KEY_ID:-}
      - MEDIA_S3_SECRET_ACCESS_KEY=${MEDIA_S3_SECRET_ACCESS_KEY:-}
      - MEDIA_S3_SESSION_TOKEN=${MEDIA_S3_SESSION_TOKEN:-}
      - MEDIA_URL_TTL_SECONDS=${MEDIA_URL_TTL_SECONDS:-900}
      - MEDIA_CACHE_TTL_SECONDS=${MEDIA_CACHE_TTL_SECONDS:-86400}
      - MEDIA_ORPHAN_GRACE_SECONDS=${MEDIA_ORPHAN_GRACE_SECONDS:-86400}
      - MEDIA_UPLOAD_CONCURRENCY=${MEDIA_UPLOAD_CONCURRENCY:-3}
      - MEDIA_UPLOAD_DAILY_LIMIT=${MEDIA_UPLOAD_DAILY_LIMIT:-20}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ASSEMBLY_AI_API_KEY=${ASSEMBLY_AI_API_KEY}
      - ASSEMBLY_AI_HTTP_TIMEOUT_SECONDS=${ASSEMBLY_AI_HTTP_TIMEOUT_SECONDS:-900}
      - ASSEMBLY_AI_REQUEST_TIMEOUT_SECONDS=${ASSEMBLY_AI_REQUEST_TIMEOUT_SECONDS:-60}
      - APIFY_API_TOKEN=${APIFY_API_TOKEN}
      - RAPIDAPI_YOUTUBE_API_KEY=${RAPIDAPI_YOUTUBE_API_KEY:-}
      - RAPIDAPI_YOUTUBE_TIMEOUT_SECONDS=${RAPIDAPI_YOUTUBE_TIMEOUT_SECONDS:-300}
      - RAPIDAPI_YOUTUBE_HOST=${RAPIDAPI_YOUTUBE_HOST:-}
      - RAPIDAPI_YOUTUBE_RELAY_HOST=${RAPIDAPI_YOUTUBE_RELAY_HOST:-}
      - APIFY_YOUTUBE_DOWNLOADER_ACTOR=${APIFY_YOUTUBE_DOWNLOADER_ACTOR:-}
      - APIFY_YOUTUBE_PROVIDERS=${APIFY_YOUTUBE_PROVIDERS:-}
      - APIFY_STORAGE_BUCKET=${APIFY_STORAGE_BUCKET:-}
      - APIFY_STORAGE_REGION=${APIFY_STORAGE_REGION:-}
      - APIFY_STORAGE_WRITER_ACCESS_KEY_ID=${APIFY_STORAGE_WRITER_ACCESS_KEY_ID:-}
      - APIFY_STORAGE_WRITER_SECRET_ACCESS_KEY=${APIFY_STORAGE_WRITER_SECRET_ACCESS_KEY:-}
      - APIFY_STORAGE_READER_ACCESS_KEY_ID=${APIFY_STORAGE_READER_ACCESS_KEY_ID:-}
      - APIFY_STORAGE_READER_SECRET_ACCESS_KEY=${APIFY_STORAGE_READER_SECRET_ACCESS_KEY:-}
      - APIFY_STORAGE_KEY_TEMPLATE=${APIFY_STORAGE_KEY_TEMPLATE:-}
      - APIFY_YOUTUBE_FALLBACK_ACTOR=${APIFY_YOUTUBE_FALLBACK_ACTOR:-}
      - APIFY_YOUTUBE_FALLBACK_ACTORS=${APIFY_YOUTUBE_FALLBACK_ACTORS:-}
      - APIFY_DOWNLOAD_MAX_CHARGE_USD=${APIFY_DOWNLOAD_MAX_CHARGE_USD:-6}
      - APIFY_FALLBACK_MAX_CHARGE_USD=${APIFY_FALLBACK_MAX_CHARGE_USD:-6}
      - APIFY_YOUTUBE_INPUT_ADAPTER=${APIFY_YOUTUBE_INPUT_ADAPTER:-start_urls}
      - APIFY_YOUTUBE_DEFAULT_QUALITY=${APIFY_YOUTUBE_DEFAULT_QUALITY:-1080}
      - APIFY_RUN_TIMEOUT_SECONDS=${APIFY_RUN_TIMEOUT_SECONDS:-3600}
      - YOUTUBE_DATA_API_KEY=${YOUTUBE_DATA_API_KEY}
      - YOUTUBE_METADATA_PROVIDER=${YOUTUBE_METADATA_PROVIDER:-yt_dlp}
      - YOUTUBE_DOWNLOAD_PROVIDER=${YOUTUBE_DOWNLOAD_PROVIDER:-yt_dlp}
      - YOUTUBE_PROXY_URL=${YOUTUBE_PROXY_URL:-}
      - YOUTUBE_PROXY_TIMEOUT_SECONDS=${YOUTUBE_PROXY_TIMEOUT_SECONDS:-300}
      - YOUTUBE_PROXY_COUNTRY=${YOUTUBE_PROXY_COUNTRY:-}
      - YOUTUBE_POT_PROVIDER_URL=${YOUTUBE_POT_PROVIDER_URL:-}
      - YOUTUBE_DOWNLOAD_MAX_BYTES=${YOUTUBE_DOWNLOAD_MAX_BYTES:-2000000000}
      - YOUTUBE_SECTION_PADDING_SECONDS=${YOUTUBE_SECTION_PADDING_SECONDS:-10}
      - YOUTUBE_MAX_HEIGHT=${YOUTUBE_MAX_HEIGHT:-1080}
      - YOUTUBE_SOURCE_CACHE=${YOUTUBE_SOURCE_CACHE:-on}
      - YOUTUBE_SOURCE_CACHE_TTL_SECONDS=${YOUTUBE_SOURCE_CACHE_TTL_SECONDS:-604800}
      - APIFY_EXPENSIVE_FALLBACKS=${APIFY_EXPENSIVE_FALLBACKS:-false}
      - LLM=${LLM:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_FALLBACK_MODEL=${OPENROUTER_FALLBACK_MODEL:-openai/gpt-6-luna}
      - RERANK_LLM=${RERANK_LLM:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - TRANSCRIPTION_PROVIDER=${TRANSCRIPTION_PROVIDER:-assemblyai}
      - TRANSCRIPTION_LANGUAGE=${TRANSCRIPTION_LANGUAGE:-}
      - WHISPER_MODEL_SIZE=${WHISPER_MODEL_SIZE:-medium}
      - MAX_VIDEO_DURATION=${MAX_VIDEO_DURATION:-5400}
      - PRO_YOUTUBE_MAX_VIDEO_DURATION=${PRO_YOUTUBE_MAX_VIDEO_DURATION:-5400}
      - SCALE_YOUTUBE_MAX_VIDEO_DURATION=${SCALE_YOUTUBE_MAX_VIDEO_DURATION:-10800}
      - QUEUED_TASK_TIMEOUT_SECONDS=${QUEUED_TASK_TIMEOUT_SECONDS:-180}
      - DEFAULT_PROCESSING_MODE=${DEFAULT_PROCESSING_MODE:-fast}
      - MAX_CLIPS=${MAX_CLIPS:-10}
      - FAST_MODE_MAX_CLIPS=${FAST_MODE_MAX_CLIPS:-10}
      - SPEAKER_FRAMING=${SPEAKER_FRAMING:-true}
      - HOOK_FIRST_TEASER=${HOOK_FIRST_TEASER:-false}
      - FAST_MODE_TRANSCRIPT_MODEL=${FAST_MODE_TRANSCRIPT_MODEL:-universal-3-5-pro}
      - SELF_HOST=${SELF_HOST:-true}
      - BACKEND_AUTH_SECRET=${BACKEND_AUTH_SECRET}
      - APP_SETTINGS_ENCRYPTION_KEY=${APP_SETTINGS_ENCRYPTION_KEY}
      - AUTH_SIGNATURE_TTL_SECONDS=${AUTH_SIGNATURE_TTL_SECONDS:-300}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3107,http://sp.localhost:3107,http://supoclip.localhost:3107}
      - PRO_PLAN_MINUTE_LIMIT=${PRO_PLAN_MINUTE_LIMIT:-600}
      - SCALE_PLAN_MINUTE_LIMIT=${SCALE_PLAN_MINUTE_LIMIT:-1500}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - "SES_FROM_EMAIL=${SES_FROM_EMAIL:-SupoClip <onboarding@example.com>}"
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3107}
      # Social publishing (OAuth apps; users connect their own accounts)
      - YOUTUBE_OAUTH_CLIENT_ID=${YOUTUBE_OAUTH_CLIENT_ID}
      - YOUTUBE_OAUTH_CLIENT_SECRET=${YOUTUBE_OAUTH_CLIENT_SECRET}
      - TIKTOK_CLIENT_KEY=${TIKTOK_CLIENT_KEY}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET}
      - INSTAGRAM_APP_ID=${INSTAGRAM_APP_ID}
      - INSTAGRAM_APP_SECRET=${INSTAGRAM_APP_SECRET}
      - SOCIAL_OAUTH_REDIRECT_BASE_URL=${SOCIAL_OAUTH_REDIRECT_BASE_URL}
      - SOCIAL_PUBLIC_MEDIA_BASE_URL=${SOCIAL_PUBLIC_MEDIA_BASE_URL}
      - SOCIAL_METRICS_REFRESH_HOURS=${SOCIAL_METRICS_REFRESH_HOURS:-6}
      - SOCIAL_METRICS_MAX_POST_AGE_DAYS=${SOCIAL_METRICS_MAX_POST_AGE_DAYS:-60}
      - SOCIAL_PERFORMANCE_MIN_POSTS=${SOCIAL_PERFORMANCE_MIN_POSTS:-3}
      - SOCIAL_PUBLISHING_ACCESS=${SOCIAL_PUBLISHING_ACCESS:-off}
      - SOCIAL_PUBLISHING_ALLOWED_EMAILS=${SOCIAL_PUBLISHING_ALLOWED_EMAILS:-}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD", ".venv/bin/arq", "--check", "src.workers.tasks.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # PO token helper for yt-dlp. Opt-in: COMPOSE_PROFILES=youtube-proxy
  # and YOUTUBE_POT_PROVIDER_URL=http://bgutil:4416. The port stays on the
  # compose network; the provider has no authentication of its own.
  bgutil:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2
    container_name: supoclip-bgutil
    profiles: ["youtube-proxy"]
    init: true
    expose:
      - "4416"
    restart: unless-stopped

  # Ships container logs to Axiom. Opt-in: COMPOSE_PROFILES=axiom + AXIOM_TOKEN.
  vector:
    image: timberio/vector:0.60.0-alpine
    container_name: supoclip-vector
    profiles: ["axiom"]
    volumes:
      - ./observability/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/nginx:/var/log/nginx:ro
      - vector_data:/var/lib/vector
    environment:
      # Vector 0.60+ only expands ${...} in its config with this set; without
      # it the literal "${AXIOM_TOKEN}" is sent and Axiom answers Unauthorized.
      - VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION=true
      - AXIOM_TOKEN=${AXIOM_TOKEN:-}
      - AXIOM_DATASET=${AXIOM_DATASET:-supoclip-prod}
    restart: unless-stopped

  # Redis for caching and job queues (useful for video processing)
  redis:
    image: redis:7-alpine
    container_name: supoclip-redis
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    command:
      [
        "sh",
        "-c",
        "if [ -n \"$${REDIS_PASSWORD}\" ]; then exec docker-entrypoint.sh redis-server --requirepass \"$${REDIS_PASSWORD}\"; fi; exec docker-entrypoint.sh redis-server",
      ]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL database for storing video metadata, user data, etc.
  postgres:
    image: postgres:15-alpine
    container_name: supoclip-postgres
    environment:
      POSTGRES_DB: supoclip
      POSTGRES_USER: supoclip
      POSTGRES_PASSWORD: supoclip_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supoclip -d supoclip"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  uploads:
    driver: local
  clips:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local
  mcp_downloads:
    driver: local
  vector_data:
    driver: local

networks:
  default:
    name: supoclip-network
