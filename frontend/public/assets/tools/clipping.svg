<svg viewBox="0 0 240 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Clipping tool">
  <rect x="0.5" y="0.5" width="239" height="159" fill="#f5f5f4" stroke="#d6d3d1"/>
  <!-- Swiss grid ticks -->
  <g stroke="#e7e5e4" stroke-width="1">
    <line x1="0" y1="40" x2="240" y2="40"/>
    <line x1="0" y1="120" x2="240" y2="120"/>
    <line x1="60" y1="0" x2="60" y2="160"/>
    <line x1="180" y1="0" x2="180" y2="160"/>
  </g>
  <!-- vertical frame (9:16 clip) -->
  <rect x="98" y="24" width="60" height="112" fill="#ffffff" stroke="#292524" stroke-width="2"/>
  <!-- crop corner marks, accent -->
  <g stroke="#0d9488" stroke-width="3" fill="none">
    <path d="M92 30 v-6 h6"/>
    <path d="M164 30 v-6 h-6"/>
    <path d="M92 130 v6 h6"/>
    <path d="M164 130 v6 h-6"/>
  </g>
  <!-- play mark -->
  <path d="M118 68 l20 12 l-20 12 z" fill="#292524"/>
  <!-- caption bars -->
  <rect x="106" y="112" width="44" height="4" fill="#a8a29e"/>
  <rect x="114" y="120" width="28" height="4" fill="#a8a29e"/>
  <!-- scissor cut line -->
  <line x1="20" y1="80" x2="92" y2="80" stroke="#78716c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="164" y1="80" x2="220" y2="80" stroke="#78716c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="20" cy="80" r="3" fill="#0d9488"/>
  <circle cx="220" cy="80" r="3" fill="#0d9488"/>
</svg>
