  <rect x="108" y="112" width="24" height="24" fill="#558a86"/>
  <text x="120" y="129" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fbfbfb" text-anchor="middle">2</text>
  <rect x="170" y="112" width="24" height="24" fill="#558a86"/>
  <text x="182" y="129" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fbfbfb" text-anchor="middle">3</text>
</svg>
