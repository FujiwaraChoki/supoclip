[project]
name = "supoclip-ytdl"
version = "0.1.0"
description = "SupoClip's self-hosted YouTube download API: yt-dlp behind rotating residential proxies."
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "yt-dlp[default]>=2026.10.10.dev0",
    "bgutil-ytdlp-pot-provider==2.0.2",
    "packaging>=24",
]

[project.scripts]
supoclip-ytdl = "supoclip_ytdl.app:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supoclip_ytdl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
